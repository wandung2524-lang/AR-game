*{box-sizing:border-box} body{margin:0;overflow:hidden;background:#172033;color:white;font-family:"Tahoma",sans-serif}
#webcam{display:none} #output_canvas{position:absolute;inset:0;width:100vw;height:100vh;transform:scaleX(-1);z-index:1}
#ui{position:absolute;inset:0;z-index:10;pointer-events:none;display:flex;flex-direction:column}
.hud{display:flex;justify-content:space-between;padding:14px 28px;background:linear-gradient(#0009,transparent)}
.box{background:#ffffff30;border:2px solid #ffffff88;border-radius:18px;padding:9px 20px;font-size:1.15rem}
.area{flex:1;display:flex;justify-content:space-between;align-items:center;padding:10px 7vw}
.col{display:flex;flex-direction:column;gap:12px}
.card{width:150px;height:150px;border-radius:22px;background:white;border:4px solid #59d7ff;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 6px 20px #0006}
.card img{width:100%;height:100%;object-fit:contain}
.answer{font-family:"Angsana New","Tahoma",sans-serif;font-size:6rem;font-weight:bold;color:#7a3cff;background:linear-gradient(135deg,#fff7b2,#ffc7d9);border-color:white}
.selected{transform:scale(1.08);box-shadow:0 0 30px gold} .correct{outline:8px solid #43e97b} .wrong{outline:8px solid #ff315f} .hidden{display:none!important}
#feedback{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;font-size:4rem;font-weight:bold;text-shadow:0 3px 12px #000;opacity:0}
#overlay{position:absolute;inset:0;background:#000c;z-index:100;display:flex;align-items:center;justify-content:center;pointer-events:auto}
.modal{background:white;color:#333;border:5px solid #4facfe;border-radius:28px;padding:32px;text-align:center;max-width:650px}
.modal h1{color:#4facfe;font-size:2.4rem} button{border:0;border-radius:40px;padding:14px 30px;font-size:1.35rem;background:#6956d9;color:white;font-weight:bold;cursor:pointer}
@media(max-width:900px){.card{width:110px;height:110px}.col{display:flex;flex-direction:column}.answer{font-size:4.5rem}}

const video=document.getElementById("webcam"), canvas=document.getElementById("output_canvas"),ctx=canvas.getContext("2d");
let finger=null, mirrored=null, selected=null, active=4,score=0,attempts=0,correct=0,wrong=0,seconds=0,timerInt;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function beep(freq=600,d=.12){try{let A=new(window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.frequency.value=freq;o.connect(g);g.connect(A.destination);g.gain.setValueAtTime(.12,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+d);o.start();o.stop(A.currentTime+d)}catch(e){}}
function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="th-TH";u.rate=.85;speechSynthesis.speak(u)}}
function loadRound(){
 active=4; selected=null;
 const set=shuffle(gameData).slice(0,4);
 const q=document.getElementById("questions"),a=document.getElementById("answers");q.innerHTML="";a.innerHTML="";
 set.forEach(x=>{let e=document.createElement("div");e.className="card";e.dataset.id=x.id;e.dataset.type="q";e.dataset.name=x.name;e.innerHTML=`<img src="${x.img}" alt="${x.name}">`;q.appendChild(e)});
 shuffle(set).forEach(x=>{let e=document.createElement("div");e.className="card answer";e.dataset.id=x.id;e.dataset.type="a";e.textContent=x.char;a.appendChild(e)});
 update();
}
function update(){document.getElementById("progress").textContent=`${5-active} / 4`;document.getElementById("score").textContent=score;document.getElementById("accuracy").textContent=(attempts?Math.round(correct/attempts*100):100)+"%";document.getElementById("timer").textContent=String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0")}
function feedback(t,ok){let f=document.getElementById("feedback");f.textContent=t;f.style.color=ok?"#43e97b":"#ff315f";f.style.opacity=1;setTimeout(()=>f.style.opacity=0,1000)}
function interact(){
 if(!mirrored)return;
 let hover=null;document.querySelectorAll(".card:not(.hidden)").forEach(c=>{let r=c.getBoundingClientRect();if(mirrored.x>=r.left&&mirrored.x<=r.right&&mirrored.y>=r.top&&mirrored.y<=r.bottom)hover=c});
 if(!hover)return;
 if(hover.dataset.type==="q"&&!selected){selected=hover;hover.classList.add("selected");beep(500);speak(hover.dataset.name)}
 else if(hover.dataset.type==="a"&&selected){
  attempts++;let src=selected;selected=null;src.classList.remove("selected");
  if(src.dataset.id===hover.dataset.id){score+=10;correct++;src.classList.add("correct");hover.classList.add("correct");beep(800);feedback("เก่งมาก!",true);speak("เก่งมาก");confetti({particleCount:100,spread:70});
   setTimeout(()=>{src.classList.add("hidden");hover.classList.add("hidden");active--;update();if(active===0)endGame()},700)
  }else{score=Math.max(0,score-5);wrong++;hover.classList.add("wrong");beep(250,.25);feedback("ลองใหม่อีกครั้ง",false);setTimeout(()=>hover.classList.remove("wrong"),500)}update();
 }
}
function endGame(){clearInterval(timerInt);setTimeout(()=>{document.getElementById("overlay").classList.remove("hidden");document.getElementById("start").classList.add("hidden");document.getElementById("end").classList.remove("hidden");document.getElementById("summary").textContent=`คะแนน ${score} | ถูก ${correct} | ผิด ${wrong} | ความแม่นยำ ${attempts?Math.round(correct/attempts*100):100}%`},800)}
function reset(){score=attempts=correct=wrong=seconds=0;document.getElementById("overlay").classList.add("hidden");loadRound();clearInterval(timerInt);timerInt=setInterval(()=>{seconds++;update()},1000)}
function onResults(res){canvas.width=innerWidth;canvas.height=innerHeight;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(res.image,0,0,canvas.width,canvas.height);
 if(res.multiHandLandmarks?.length){let p=res.multiHandLandmarks[0][8];finger={x:p.x*canvas.width,y:p.y*canvas.height};mirrored={x:(1-p.x)*innerWidth,y:p.y*innerHeight};ctx.beginPath();ctx.arc(finger.x,finger.y,18,0,Math.PI*2);ctx.fillStyle="gold";ctx.fill();ctx.strokeStyle="white";ctx.lineWidth=4;ctx.stroke();
 if(selected){let r=selected.getBoundingClientRect();ctx.beginPath();ctx.moveTo((1-(r.left+r.width/2)/innerWidth)*canvas.width,(r.top+r.height/2)/innerHeight*canvas.height);ctx.lineTo(finger.x,finger.y);ctx.strokeStyle="gold";ctx.lineWidth=6;ctx.stroke()}
 }else mirrored=null; interact();requestAnimationFrame(()=>{});
}
const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.7,minTrackingConfidence:.7});hands.onResults(onResults);
const camera=new Camera(video,{onFrame:async()=>await hands.send({image:video}),width:1280,height:720});
document.getElementById("startBtn").onclick=()=>camera.start().then(reset).catch(()=>alert("กรุณากด Allow เพื่ออนุญาตการใช้กล้อง"));
document.getElementById("restartBtn").onclick=()=>{document.getElementById("end").classList.add("hidden");reset()};
</script></body></html>
